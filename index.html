<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TheCozzyLoops – Cute Handmade Crochet Flowers & Gifts</title>
    <meta name="description" content="Handmade crochet flowers, cute bookmarks, keychains, and custom gifts made with soft cotton yarn." />
    <meta property="og:title" content="TheCozzyLoops – Cute Handmade Crochet Flowers & Gifts" />
    <meta property="og:description" content="Handmade crochet flowers, cute bookmarks, keychains, and custom gifts made with soft cotton yarn." />
    <meta property="og:image" content="/images/crochet-main.jpg" />
    <meta name="theme-color" content="#FBF9F6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Apply persisted theme before first paint to avoid a flash of the wrong mode.
      (function () {
        try {
          var stored = localStorage.getItem('thecozzyloops_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored ? stored === 'dark' : prefersDark;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
